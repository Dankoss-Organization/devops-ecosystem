name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-infra:
    name: Infrastructure Lint
    uses: ./.github/workflows/lint-infra.yml

  security-scan:
    name: Security Scan
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit
